        .storm-layer{
            position:fixed;
            inset:0;
            z-index:0;
            overflow:hidden;
            pointer-events:none;
        }

        .storm-layer::before{
            content:"";

            inset:0;
            background:

        }

        .rain:nth-child(1){
            left:3%;
            animation-duration:.95s;
            animation-delay:.05s;
        }

        .rain:nth-child(2){
            left:10%;

            animation-delay:.35s;
        }

        .rain:nth-child(3){
            left:18%;

            animation-delay:.18s;
        }

        .rain:nth-child(4){

            animation-delay:.52s;
        }

        .rain:nth-child(5){

            animation-delay:.12s;
        }

        .rain:nth-child(6){
            left:45%;
            animation-duration:1.28s;
            animation-delay:.68s;
        }

        .rain:nth-child(7){

            animation-delay:.24s;
        }

        .rain:nth-child(8){
            left:64%;
            animation-duration:1.16s;
            animation-delay:.46s;
        }

        .rain:nth-child(9){
            left:73%;
            animation-duration:.86s;
            animation-delay:.08s;
        }

        .rain:nth-child(10){
            left:82%;
            animation-duration:1.24s;
            animation-delay:.61s;
        }

        .rain:nth-child(11){
            left:90%;
            animation-duration:.98s;
            animation-delay:.28s;
        }

        .rain:nth-child(12){
            left:97%;
            animation-duration:1.12s;
            animation-delay:.43s;
        }

        .bolt{
            position:absolute;
            top:2vh;
            width:180px;
            height:72vh;
            opacity:0;
            animation:boltStrike 2.1s ease-in-out infinite;
        }

        .bolt-left{
            left:-18px;
        }

        .bolt-left.second{
            left:14%;
            top:6vh;
            transform:scale(.72);
            animation-delay:.72s;
        }

        .bolt-right{
            right:-18px;
            transform:scaleX(-1);
            animation-delay:1.05s;
        }

        .bolt-right.second{
            right:13%;
            top:9vh;
            transform:scaleX(-1) scale(.7);
            animation-delay:1.55s;
        }

        .bolt span{
            position:absolute;
            display:block;
            width:6px;
            border-radius:999px;
            transform-origin:top center;
            background:
                linear-gradient(
                    #fff,
                    #fffbd0 36%,
                    #ffe600 70%,
                    transparent
                );
            box-shadow:
                0 0 8px #fff,
                0 0 16px #ffe600,
                0 0 28px #ffb300;
        }

        .bolt span:nth-child(1){
            left:36px;
            top:0;
            height:118px;
            transform:rotate(20deg);
        }

        .bolt span:nth-child(2){
            left:76px;
            top:101px;
            height:106px;
            transform:rotate(-25deg);
        }

        .bolt span:nth-child(3){
            left:35px;
            top:190px;
            height:116px;
            transform:rotate(23deg);
        }

        .bolt span:nth-child(4){
            left:76px;
            top:289px;
            height:112px;

        }

        .bolt span:nth-child(5){
            left:39px;
            top:386px;
            height:142px;
            transform:rotate(17deg);

        @keyframes gridMove{
            to{
                background-position:40px 40px;
            }
        }

        @keyframes rainDrop{
            0%{
                transform:translate3d(0,-120px,0) rotate(var(--angle,0deg));
                opacity:0;
            }

            12%{
                opacity:.82;
            }

            100%{
                transform:translate3d(36px,115vh,0) rotate(var(--angle,0deg));
                opacity:0;
            }
        }

        @keyframes screenFlash{
            0%,67%,100%{
                opacity:0;
                transform:translateX(-75%) rotate(-7deg);
            }

            69%{
                opacity:.9;
            }

            71%{
                opacity:.08;
            }

            73%{
                opacity:.68;
            }

            79%{
                opacity:0;
                transform:translateX(75%) rotate(-7deg);
            }
        }

        @keyframes boltStrike{
            0%,74%,100%{
                opacity:0;
                filter:brightness(1);
            }

            76%{
                opacity:1;
                filter:brightness(1.4);
            }

            78%{
                opacity:.06;
            }

            80%{
                opacity:.95;
            }

            84%{
                opacity:0;
            }
        }

        .page-shell{
            position:relative;
            z-index:2;
            width:100%;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px 14px 32px;
        }

        #container{
            position:relative;
            width:100%;
            max-width:520px;
            padding:22px;
            overflow:hidden;
            border:1px solid rgba(255,230,0,.62);
            border-radius:28px;
            background:
                radial-gradient(circle at 50% 0%,rgba(255,230,0,.15),transparent 34%),
                linear-gradient(180deg,rgba(18,18,18,.96),rgba(3,3,3,.98));
            box-shadow:
                0 0 32px rgba(255,230,0,.36),
                0 0 70px rgba(255,179,0,.18),
                0 24px 60px rgba(0,0,0,.72),
                inset 0 0 30px rgba(255,230,0,.08);
        }

        #container::before{
            content:"";
            position:absolute;
            inset:-50%;
            pointer-events:none;
            background:
                conic-gradient(
                    transparent,
                    rgba(255,230,0,.15),
                    transparent,
                    rgba(255,255,255,.07),
                    transparent

            animation:panelRotate 12s linear infinite;
        }

        #container::after{
            content:"";
            position:absolute;
            top:0;
            bottom:0;
            left:-70%;
            width:42%;
            pointer-events:none;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.18),
                    rgba(255,230,0,.22),
                    transparent
                );
            transform:skewX(-20deg);
            animation:panelSweep 2.2s linear infinite;
        }

        @keyframes panelRotate{
            to{
                transform:rotate(360deg);
            }
        }

        @keyframes panelSweep{
            to{
                left:140%;
            }
        }

        .content-layer{
            position:relative;
            z-index:3;
        }

            position:relative;
            text-align:center;
            margin-bottom:16px;
            animation:logoFloat 2.4s ease-in-out infinite;
        }

        .logo-wrapper::before{
            content:"";
            position:absolute;
            left:50%;
            top:50%;
            width:280px;
            height:96px;
            transform:translate(-50%,-50%);
            border-radius:50%;
            background:
                radial-gradient(
                    circle,
                    rgba(255,230,0,.42),
                    transparent 68%
                );
            filter:blur(13px);
            animation:logoGlow 1.5s ease-in-out infinite alternate;
        }

        .logo-img{
            position:relative;
            z-index:2;
            filter:
                drop-shadow(0 0 12px rgba(255,230,0,.95))
                drop-shadow(0 0 24px rgba(255,179,0,.58));
        }

        @keyframes logoFloat{
            0%,100%{
                transform:translateY(0);
            }

            50%{
                transform:translateY(-6px);
            }
        }

        @keyframes logoGlow{
            from{
                opacity:.45;
                transform:translate(-50%,-50%) scale(.92);
            }

            to{
                opacity:1;
                transform:translate(-50%,-50%) scale(1.08);
            }
        }

        h1.title{
            margin:0 0 20px;
            font-family:'Orbitron',sans-serif;
            font-size:18px;
            line-height:1.5;
            text-align:center;
            text-transform:uppercase;
            color:#fffbd0;
            text-shadow:
                0 0 9px rgba(255,230,0,.8),
                0 0 20px rgba(255,179,0,.38);
        }

        .title-line{
            width:72%;
            height:2px;
            margin:0 auto 20px;
            background:
                linear-gradient(

                    transparent,

                    transparent

            animation:titleLine 1.2s ease-in-out infinite alternate;
        }

        @keyframes titleLine{
            from{

                transform:scaleX(.86);
            }

                transform:scaleX(1);
            }
        }

        .hero-shell{
            position:relative;
            padding:4px;
            overflow:hidden;
            border-radius:22px;
            background:

                    #fffbd0,

                    #ffe600,
                    #3b2c00

            background-size:300% 100%;
            box-shadow:
                0 0 24px rgba(255,230,0,.58),
                0 0 46px rgba(255,179,0,.24);
            animation:heroBorder 1.35s ease-in-out infinite alternate;
            margin-bottom:22px;
        }

        .hero-card{
            position:relative;
            overflow:hidden;
            border-radius:18px;
            background:#050505;
        }

        .hero-card::before{
            content:"";
            position:absolute;
            top:-70%;
            left:-70%;
            width:42%;
            height:240%;
            z-index:2;
            pointer-events:none;
            background:

                    rgba(255,255,255,.14) 74%,
                    transparent 100%

            transform:rotate(24deg);
            animation:heroShine 2s ease-in-out infinite;
        }

        .hero-card::after{
            content:"";
            position:absolute;
            inset:0;
            z-index:2;
            pointer-events:none;
            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.06),
                    transparent 25%,
                    rgba(0,0,0,.18)
                );
        }

        .hero-card amp-img{
            display:block;
        }

        @keyframes heroBorder{
            from{
                background-position:0 50%;
            }

            to{
                background-position:100% 50%;
            }
        }

        @keyframes heroShine{
            0%{
                left:-70%;
                opacity:0;
            }

            18%{
                opacity:1;
            }

            58%{
                left:115%;
                opacity:.95;
            }

            100%{

                opacity:0;
            }
        }

        .btn-list{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .btn{
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:54px;
            padding:14px 16px;
            overflow:hidden;

            content:"";
            position:absolute;
            top:0;
            bottom:0;
            left:-70%;
            width:42%;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.5),
                    transparent

            transform:skewX(-22deg);
            animation:buttonShine 1.65s linear infinite;
        }

        .btn::after{
            content:"";
            position:absolute;
            inset:3px;
            pointer-events:none;
            border:1px solid rgba(255,255,255,.18);
            border-radius:11px;
        }

        .btn-login{
            color:#141000;
            background:
                linear-gradient(
                    90deg,
                    #725200,
                    #ffe600,
                    #fff5a0,
                    #ffb300,
                    #ffe600,
                    #725200
                );
            background-size:300% 100%;
            box-shadow:
                0 0 20px rgba(255,230,0,.48),
                0 10px 24px rgba(0,0,0,.45);
            animation:buttonFlow 1.25s ease-in-out infinite alternate;
        }

        .btn-daftar{
            color:#fffbd0;
            background:
                linear-gradient(
                    90deg,
                    #020202,
                    #2f2400,
                    #020202,
                    #5e4600,
                    #020202
                );
            background-size:280% 100%;
            text-shadow:0 0 8px rgba(255,230,0,.78);
            animation:buttonFlow 1.45s ease-in-out infinite alternate-reverse;
        }

        .btn-alt{
            grid-column:1/-1;
            color:#fff;
            background:
                linear-gradient(
                    90deg,
                    #311c00,
                    #ff8a00,
                    #ffb300,
                    #311c00
                );
            background-size:260% 100%;
            box-shadow:
                0 0 18px rgba(255,179,0,.38),
                0 10px 24px rgba(0,0,0,.45);
            animation:buttonFlow 1.35s ease-in-out infinite alternate;
        }

        .btn:active{
            transform:translateY(2px) scale(.985);
        }

        @keyframes buttonShine{
            to{
                left:140%;
            }
        }

        @keyframes buttonFlow{
            from{
                background-position:0 50%;
            }

            to{
                background-position:100% 50%;
            }
        }

        .footer{
            margin-top:24px;
            padding:13px 10px;
            border:1px solid rgba(255,230,0,.34);
            border-radius:14px;
            color:#a8a289;
            background:
                linear-gradient(
                    90deg,
                    rgba(255,230,0,.06),
                    rgba(0,0,0,.75),
                    rgba(255,230,0,.06)
                );
            font-size:12px;
            line-height:1.6;
            text-align:center;
            box-shadow:0 0 16px rgba(255,230,0,.12);
        }

        .footer a{
            color:#ffe600;
            font-weight:800;
            text-shadow:0 0 8px rgba(255,230,0,.48);
        }

        @media(min-width:900px){
            .page-shell{
                padding:32px 18px 44px;
            }

            #container{
                max-width:920px;
                padding:28px 30px;
            }

            .desktop-grid{
                display:grid;
                grid-template-columns:.9fr 1.1fr;
                gap:28px;
                align-items:center;
            }

            .desktop-copy{
                min-width:0;
            }

            .hero-shell{
                margin-bottom:0;
            }

            h1.title{
                font-size:24px;
                text-align:left;
                margin-bottom:14px;
            }

            .title-line{
                width:58%;
                margin:0 0 22px;
            }

            .logo-wrapper{
                text-align:left;
            }

            .logo-wrapper::before{
                left:125px;
            }

            .btn-list{
                grid-template-columns:repeat(3,1fr);
            }

            .btn-alt{
                grid-column:auto;
            }

            .footer{
                margin-top:28px;
            }
        }

        @media(max-width:520px){
            .page-shell{
                padding:10px 8px 18px;
            }

            #container{
                padding:18px 13px;
                border-radius:22px;
            }

            h1.title{
                font-size:15px;
            }

            .btn-list{
                grid-template-columns:1fr;
            }

            .btn-alt{
                grid-column:auto;
            }

            .btn{
                font-size:12px;
                min-height:50px;
            }

            .bolt-left.second,
            .bolt-right.second{
                display:none;
            }

            .bolt{
                transform:scale(.72);
            }

            .bolt-right{
                transform:scaleX(-1) scale(.72);
            }

            .rain{
                height:78px;
            }
        }

        @media(prefers-reduced-motion:reduce){
            *,
            *::before,
            *::after{
                animation-duration:.01ms;
                animation-iteration-count:1;
            }
        }
    </style>
</head>
